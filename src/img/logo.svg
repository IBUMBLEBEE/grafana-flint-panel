<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Flint AI panel logo</title>
  <desc id="description">A faceted F inside an orange-to-yellow dashboard panel, with an AI inspiration sparkle floating beyond the upper-right corner.</desc>

  <defs>
    <linearGradient id="flint-gradient" gradientUnits="userSpaceOnUse" x1="64" y1="12" x2="64" y2="116">
      <stop offset="0" stop-color="#f05a28" />
      <stop offset="1" stop-color="#fbca0a" />
    </linearGradient>
    <linearGradient id="spark-gradient" gradientUnits="userSpaceOnUse" x1="102" y1="4" x2="102" y2="68">
      <stop offset="0" stop-color="#fbca0a" />
      <stop offset="1" stop-color="#f05a28" />
    </linearGradient>
    <mask id="spark-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#ffffff" />
      <circle cx="102" cy="24" r="29" fill="#000000" />
    </mask>
  </defs>

  <rect x="10" y="28" width="92" height="90" rx="20" fill="#202226" stroke="url(#flint-gradient)" stroke-width="6" mask="url(#spark-clearance)" />

  <path d="M30 100V54L44 40h32v16H50v12h20v16H50v16Z" fill="url(#flint-gradient)" />
  <path d="M30 54 44 40h6L38 58v42h-8Z" fill="#ffffff" fill-opacity=".22" />

  <g fill="url(#spark-gradient)">
    <path d="M102 4Q106 20 122 24Q106 28 102 44Q98 28 82 24Q98 20 102 4Z" />
    <path d="M114 52Q116 58 122 60Q116 62 114 68Q112 62 106 60Q112 58 114 52Z" />
