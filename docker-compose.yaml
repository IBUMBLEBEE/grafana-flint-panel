services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.2.2}
        grafana_registry: ${GRAFANA_REGISTRY:-docker.m.daocloud.io}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ibumblebee-flint-panel,ibumblebee-flintai-datasource
      GF_PLUGINS_FORWARD_HOST_ENV_VARS: ibumblebee-flintai-datasource
      GF_LOG_FILTERS: plugin.ibumblebee-flint-panel:debug plugin.ibumblebee-flintai-datasource:debug
      FLINT_AI_API_KEY: ${FLINT_AI_API_KEY:-}
      FLINT_AI_API_KEY_SECONDARY: ${FLINT_AI_API_KEY_SECONDARY:-}
    volumes:
      - ../flint-ai-datasource/dist:/var/lib/grafana/plugins/ibumblebee-flintai-datasource
